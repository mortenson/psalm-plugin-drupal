name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - php: '8.1'
            psalm: '^6'
          - php: '8.3'
            psalm: '^7'
    steps:
    - uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      env:
          fail-fast: true

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-psalm-${{ matrix.psalm }}

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --with "vimeo/psalm:${{ matrix.psalm }}"

    - name: Check code style
      run: composer run-script cs-check

    - name: Run test suite
      run: composer run-script test
